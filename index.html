<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>AV Flap</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#08081a;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
@import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Barlow+Condensed:wght@400;700;900&display=swap');
body{font-family:'Barlow Condensed','Arial Black',Arial,sans-serif}
#gc{display:block;position:fixed;top:0;left:0;width:100%;height:100%}

/* SELECT SCREEN */
#ss{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  background:radial-gradient(ellipse at 50% 10%,#1e0540 0%,#08081a 60%)}
.ss-glow{position:absolute;top:0;left:50%;transform:translateX(-50%);width:300px;height:180px;
  background:radial-gradient(ellipse,rgba(168,85,247,0.18) 0%,transparent 70%);pointer-events:none}

.ttl{font-size:clamp(42px,11vw,68px);font-weight:900;color:#fff;letter-spacing:8px;line-height:1;
  text-shadow:0 0 30px rgba(168,85,247,0.8),0 0 80px rgba(168,85,247,0.3);
  font-family:'Black Han Sans','Barlow Condensed','Arial Black',sans-serif}
.ttl span{color:#a855f7}
.sub{font-size:clamp(10px,2.6vw,13px);color:#7c6a9a;letter-spacing:4px;text-transform:uppercase;font-weight:700}

.cgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 18px;max-width:380px;width:100%}
.cc{background:rgba(255,255,255,0.03);border:1.5px solid rgba(255,255,255,0.08);border-radius:14px;
  display:flex;flex-direction:column;align-items:center;padding:10px 8px 8px;cursor:pointer;gap:6px;
  transition:all .15s ease;position:relative;overflow:hidden}
.cc::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(168,85,247,0.12),transparent 70%);opacity:0;transition:opacity .15s}
.cc:active{transform:scale(0.94)}
.cc.sel{border-color:rgba(168,85,247,0.7);background:rgba(168,85,247,0.1);
  box-shadow:0 0 20px rgba(168,85,247,0.25),inset 0 0 20px rgba(168,85,247,0.05)}
.cc.sel::before{opacity:1}
.cc canvas{border-radius:8px;background:rgba(0,0,0,0.2);display:block}
.cn{color:#fff;font-size:clamp(12px,3.4vw,15px);font-weight:900;letter-spacing:2px;text-transform:uppercase}

.pb{background:linear-gradient(135deg,#7c3aed 0%,#a855f7 50%,#db2777 100%);
  background-size:200% 100%;color:#fff;border:none;border-radius:40px;
  padding:14px 44px;font-size:clamp(15px,4.5vw,20px);font-weight:900;letter-spacing:2px;
  cursor:pointer;box-shadow:0 0 30px rgba(168,85,247,0.4);transition:all .15s;
  font-family:'Barlow Condensed','Arial Black',sans-serif}
.pb:active{transform:scale(0.94);box-shadow:0 0 15px rgba(168,85,247,0.3)}
</style>
</head>
<body>
<canvas id="gc"></canvas>
<div id="ss">
  <div class="ss-glow"></div>
  <div class="ttl">AV<span>&nbsp;FLAP</span></div>
  <div class="sub">Choisissez votre pilote</div>
  <div class="cgrid" id="cg"></div>
  <button class="pb" id="pb">▶&nbsp;&nbsp;JOUER</button>
</div>
<script>
'use strict';
const gc=document.getElementById('gc'),ctx=gc.getContext('2d');
let W,H;
const rsz=()=>{gc.width=W=innerWidth;gc.height=H=innerHeight};
rsz();addEventListener('resize',()=>{rsz();if(ST==='select')buildSel()});

// ── POLYFILL roundRect
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    const R=Math.min(+r||0,w/2,h/2);
    this.moveTo(x+R,y);this.arcTo(x+w,y,x+w,y+h,R);
    this.arcTo(x+w,y+h,x,y+h,R);this.arcTo(x,y+h,x,y,R);
    this.arcTo(x,y,x+w,y,R);this.closePath();
  };
}

// ── CONSTANTS
const GRAV=0.38,BSPD=3.0,SPDI=0.000115;
const CSZ=62,OW=56,GAPST=208,GAPMIN=148,OBSP=230;
const FLOORR=0.87,CEIL=66;

// ════════════════════════════════════════
// WINGS
// ════════════════════════════════════════
function wings(ctx,cx,cy,sz,ph,col){
  const s=sz/64,fl=Math.sin(ph),c=col||'#f0e8d2';
  ctx.save();
  for(const d of[-1,1]){
    const ax=cx+d*sz*.3,ay=cy;
    const tx=ax+d*sz*.82;
    const ty=ay-sz*.22*(1+fl*.65);
    ctx.beginPath();
    ctx.moveTo(ax,ay-sz*.09);
    ctx.bezierCurveTo(ax+d*sz*.23,ty-sz*.2,tx-d*sz*.07,ty-sz*.04,tx,ty);
    ctx.bezierCurveTo(tx-d*sz*.1,ty+sz*.12,ax+d*sz*.33,ay+sz*.14,ax,ay+sz*.09);
    ctx.fillStyle=c;ctx.strokeStyle='rgba(0,0,0,0.18)';ctx.lineWidth=1.4*s;
    ctx.fill();ctx.stroke();
    // feather lines
    ctx.strokeStyle='rgba(0,0,0,0.09)';ctx.lineWidth=0.6*s;
    for(let i=1;i<=3;i++){
      const t=i/4,lx=ax+(tx-ax)*t,ly=ay-sz*.07+(ty-ay+sz*.07)*t*.85;
      ctx.beginPath();ctx.moveTo(lx,ay+sz*.05);ctx.lineTo(lx,ly);ctx.stroke();
    }
  }
  ctx.restore();
}

// ════════════════════════════════════════
// CHARACTER: SEB — saint, halo, lunettes rondes, barbe, robe bleue
// Traits clés: lunettes RONDES, barbe courte, expression méditative, halo
// ════════════════════════════════════════
function dSeb(ctx,cx,cy,sz,ph){
  const s=sz/64;wings(ctx,cx,cy,sz,ph,'#e8d8b0');
  ctx.save();
  // Robe bleue
  ctx.fillStyle='#3a5a9a';ctx.strokeStyle='#27406e';ctx.lineWidth=1.5*s;
  ctx.beginPath();
  ctx.moveTo(cx-13*s,cy+2*s);
  ctx.bezierCurveTo(cx-17*s,cy+25*s,cx-12*s,cy+42*s,cx-6*s,cy+46*s);
  ctx.lineTo(cx+6*s,cy+46*s);
  ctx.bezierCurveTo(cx+12*s,cy+42*s,cx+17*s,cy+25*s,cx+13*s,cy+2*s);
  ctx.fill();ctx.stroke();
  // Drapé robe
  ctx.strokeStyle='rgba(0,0,80,0.25)';ctx.lineWidth=1*s;
  ctx.beginPath();ctx.moveTo(cx-4*s,cy+5*s);ctx.lineTo(cx-8*s,cy+45*s);ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx+2*s,cy+6*s);ctx.lineTo(cx+6*s,cy+46*s);ctx.stroke();
  // Halo doré
  ctx.save();
  ctx.strokeStyle='#f0c030';ctx.lineWidth=3.5*s;ctx.globalAlpha=0.9;
  ctx.beginPath();ctx.arc(cx,cy-27*s,15*s,0,Math.PI*2);ctx.stroke();
  ctx.strokeStyle='rgba(255,200,0,0.25)';ctx.lineWidth=8*s;
  ctx.beginPath();ctx.arc(cx,cy-27*s,15*s,0,Math.PI*2);ctx.stroke();
  ctx.restore();
  // Cou
  ctx.fillStyle='#d4a882';ctx.fillRect(cx-5*s,cy-4*s,10*s,8*s);
  // Visage ovale (légèrement allongé)
  ctx.fillStyle='#d4a882';ctx.strokeStyle='#9a7050';ctx.lineWidth=1.5*s;
  ctx.beginPath();ctx.ellipse(cx,cy-14*s,13.5*s,18*s,0,0,Math.PI*2);ctx.fill();ctx.stroke();
  // Cheveux courts bruns
  ctx.fillStyle='#2a1a0a';
  ctx.beginPath();ctx.ellipse(cx,cy-25*s,14*s,8*s,0,Math.PI,0);ctx.fill();
  ctx.beginPath();ctx.ellipse(cx-12*s,cy-23*s,5*s,7*s,0.2,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(cx+12*s,cy-23*s,5*s,7*s,-0.2,0,Math.PI*2);ctx.fill();
  // LUNETTES RONDES (trait distinctif)
  ctx.strokeStyle='#1a0a00';ctx.lineWidth=2.5*s;ctx.fillStyle='rgba(180,220,255,0.22)';
  ctx.beginPath();ctx.arc(cx-6.5*s,cy-14*s,5.8*s,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.arc(cx+6.5*s,cy-14*s,5.8*s,0,Math.PI*2);ctx.fill();ctx.stroke();
  // Pont et branches
  ctx.lineWidth=1.8*s;
  ctx.beginPath();ctx.moveTo(cx-.8*s,cy-14*s);ctx.lineTo(cx+.8*s,cy-14*s);ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx-12.3*s,cy-14*s);ctx.lineTo(cx-14.5*s,cy-13*s);ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx+12.3*s,cy-14*s);ctx.lineTo(cx+14.5*s,cy-13*s);ctx.stroke();
  // Yeux contemplatifs (petits, légèrement baissés)
  ctx.fillStyle='#2a1505';
  ctx.beginPath();ctx.ellipse(cx-6.5*s,cy-13.5*s,2.2*s,1.8*s,0.25,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(cx+6.5*s,cy-13.5*s,2.2*s,1.8*s,-0.25,0,Math.PI*2);ctx.fill();
  // Reflets lunettes
  ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=1.2*s;
  ctx.beginPath();ctx.arc(cx-9*s,cy-17*s,2.5*s,-0.8,-0.1);ctx.stroke();
  ctx.beginPath();ctx.arc(cx+4*s,cy-17*s,2.5*s,-0.8,-0.1);ctx.stroke();
  // Nez fin
  ctx.strokeStyle='#9a7050';ctx.lineWidth=1*s;
  ctx.beginPath();ctx.moveTo(cx-1.5*s,cy-7*s);ctx.lineTo(cx-3*s,cy-2*s);ctx.lineTo(cx-1*s,cy-2*s);ctx.stroke();
  // BARBE COURTE
  ctx.fillStyle='#3a2515';ctx.strokeStyle='#2a1a0a';ctx.lineWidth=0.8*s;
  ctx.beginPath();
  ctx.moveTo(cx-9*s,cy-3*s);
  ctx.bezierCurveTo(cx-10*s,cy+3*s,cx-7*s,cy+7*s,cx,cy+7.5*s);
  ctx.bezierCurveTo(cx+7*s,cy+7*s,cx+10*s,cy+3*s,cx+9*s,cy-3*s);
  ctx.fill();ctx.stroke();
  // Lignes barbe
  ctx.strokeStyle='rgba(0,0,0,0.2)';ctx.lineWidth=0.6*s;
  for(let i=-1;i<=1;i++){
    ctx.beginPath();ctx.moveTo(cx+i*4*s,cy-2*s);ctx.lineTo(cx+i*3.5*s,cy+5*s);ctx.stroke();
  }
  // Bouche légèrement incurvée
  ctx.strokeStyle='#6a3820';ctx.lineWidth=1.5*s;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(cx-3.5*s,cy+.5*s);ctx.quadraticCurveTo(cx,cy+2.5*s,cx+3.5*s,cy+.5*s);ctx.stroke();
  ctx.restore();
}

// ════════════════════════════════════════
// CHARACTER: PIERRE — casque orange, grosses lunettes, sourire
// Traits clés: CASQUE ORANGE, lunettes épaisses rectangulaires, sourire immense avec rides
// ════════════════════════════════════════
function dPierre(ctx,cx,cy,sz,ph){
  const s=sz/64;wings(ctx,cx,cy,sz,ph,'#f0e8c0');
  ctx.save();
  // Veste rouge avec bandes réfléchissantes
  ctx.fillStyle='#cc3300';ctx.strokeStyle='#881a00';ctx.lineWidth=1.5*s;
  ctx.beginPath();
  ctx.moveTo(cx-15*s,cy+2*s);
  ctx.bezierCurveTo(cx-19*s,cy+25*s,cx-13*s,cy+42*s,cx-6*s,cy+47*s);
  ctx.lineTo(cx+6*s,cy+47*s);
  ctx.bezierCurveTo(cx+13*s,cy+42*s,cx+19*s,cy+25*s,cx+15*s,cy+2*s);
  ctx.fill();ctx.stroke();
  // Bandes jaunes réfléchissantes
  ctx.fillStyle='#ffcc00';
  ctx.fillRect(cx-15*s,cy+15*s,30*s,5*s);
  ctx.fillRect(cx-15*s,cy+28*s,30*s,5*s);
  // Badges
  ctx.fillStyle='rgba(255,255,255,0.2)';ctx.fillRect(cx-13*s,cy+7*s,7*s,5*s);
  // Visage large (plus âgé)
  ctx.fillStyle='#c08060';ctx.strokeStyle='#8a5030';ctx.lineWidth=1.5*s;
  ctx.beginPath();ctx.ellipse(cx,cy-9*s,16*s,17.5*s,0,0,Math.PI*2);ctx.fill();ctx.stroke();
  // CASQUE ORANGE (trait distinctif)
  ctx.fillStyle='#e85000';ctx.strokeStyle='#a83800';ctx.lineWidth=2*s;
  ctx.beginPath();ctx.ellipse(cx,cy-21*s,18.5*s,12*s,0,Math.PI,0);ctx.fill();ctx.stroke();
  // Bord casque
  ctx.lineWidth=3*s;
  ctx.beginPath();ctx.moveTo(cx-21*s,cy-21*s);ctx.lineTo(cx+21*s,cy-21*s);ctx.stroke();
  // Lampe frontale du casque
  ctx.fillStyle='#fff';ctx.strokeStyle='#ccc';ctx.lineWidth=1*s;
  ctx.beginPath();ctx.ellipse(cx+3*s,cy-27*s,4*s,3*s,0,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.fillStyle='rgba(255,255,200,0.6)';
  ctx.beginPath();ctx.arc(cx+3*s,cy-27*s,2*s,0,Math.PI*2);ctx.fill();
  // Cou
  ctx.fillStyle='#c08060';ctx.fillRect(cx-6*s,cy-4*s,12*s,8*s);
  // GROSSES LUNETTES RECTANGULAIRES NOIRES (trait distinctif)
  ctx.strokeStyle='#0a0a0a';ctx.lineWidth=3.5*s;ctx.fillStyle='rgba(200,230,255,0.24)';
  const lw=14*s,lh=10*s;
  ctx.fillRect(cx-17*s,cy-15*s,lw,lh);ctx.strokeRect(cx-17*s,cy-15*s,lw,lh);
  ctx.fillRect(cx+3*s,cy-15*s,lw,lh);ctx.strokeRect(cx+3*s,cy-15*s,lw,lh);
  // Pont
  ctx.beginPath();ctx.moveTo(cx-3*s,cy-11*s);ctx.lineTo(cx+3*s,cy-11*s);ctx.stroke();
  // Branches
  ctx.beginPath();ctx.moveTo(cx-17*s,cy-11*s);ctx.lineTo(cx-20*s,cy-10*s);ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx+17*s,cy-11*s);ctx.lineTo(cx+20*s,cy-10*s);ctx.stroke();
  // Yeux souriant (arcs fermés)
  ctx.strokeStyle='#222';ctx.lineWidth=2.2*s;
  ctx.beginPath();ctx.arc(cx-10*s,cy-11*s,3.5*s,0.15,Math.PI-0.15,true);ctx.stroke();
  ctx.beginPath();ctx.arc(cx+10*s,cy-11*s,3.5*s,0.15,Math.PI-0.15,true);ctx.stroke();
  // Nez bulbeux
  ctx.fillStyle='#b07050';
  ctx.beginPath();ctx.arc(cx,cy-3*s,3*s,0,Math.PI*2);ctx.fill();
  // RIDES du sourire (trait distinctif)
  ctx.strokeStyle='#9a6030';ctx.lineWidth=1.2*s;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(cx-13*s,cy-5*s);ctx.quadraticCurveTo(cx-16*s,cy+1*s,cx-12*s,cy+5*s);ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx+13*s,cy-5*s);ctx.quadraticCurveTo(cx+16*s,cy+1*s,cx+12*s,cy+5*s);ctx.stroke();
  // Rides front
  ctx.strokeStyle='rgba(120,80,40,0.35)';ctx.lineWidth=0.8*s;
  ctx.beginPath();ctx.moveTo(cx-8*s,cy-21*s);ctx.lineTo(cx+8*s,cy-21*s);ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx-6*s,cy-18*s);ctx.lineTo(cx+6*s,cy-18*s);ctx.stroke();
  // GRAND SOURIRE AVEC DENTS
  ctx.fillStyle='#5a1500';
  ctx.beginPath();
  ctx.moveTo(cx-11*s,cy+1*s);ctx.quadraticCurveTo(cx,cy+10*s,cx+11*s,cy+1*s);
  ctx.lineTo(cx+11*s,cy+4.5*s);ctx.quadraticCurveTo(cx,cy+13.5*s,cx-11*s,cy+4.5*s);
  ctx.closePath();ctx.fill();
  // Dents
  ctx.fillStyle='#fff';
  ctx.fillRect(cx-10*s,cy+1.5*s,20*s,4*s);
  // Séparation dents
  ctx.strokeStyle='#ddd';ctx.lineWidth=0.8*s;
  for(let i=-3;i<=3;i++){
    if(i===0)continue;
    ctx.beginPath();ctx.moveTo(cx+i*3.5*s,cy+1.5*s);ctx.lineTo(cx+i*3.5*s,cy+5.5*s);ctx.stroke();
  }
  // Crasse/saleté sur le visage (mineur)
  ctx.fillStyle='rgba(30,20,10,0.15)';
  ctx.beginPath();ctx.ellipse(cx-5*s,cy-1*s,3*s,2*s,0.5,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(cx+8*s,cy-5*s,2*s,1.5*s,-0.3,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

// ════════════════════════════════════════
// CHARACTER: THIB — barbare, mâchoire carrée, sourcils froncés, muscles
// Traits clés: SOURCILS FRONCÉS INTENSES, mâchoire forte, barbe courte, épaules larges
// ════════════════════════════════════════
function dThib(ctx,cx,cy,sz,ph){
  const s=sz/64;wings(ctx,cx,cy,sz,ph,'#d8c8a0');
  ctx.save();
  // Corps large (musclé)
  ctx.fillStyle='#4a2e10';ctx.strokeStyle='#2a1a06';ctx.lineWidth=1.5*s;
  ctx.beginPath();
  ctx.moveTo(cx-21*s,cy+2*s);ctx.lineTo(cx-21*s,cy+43*s);
  ctx.lineTo(cx+21*s,cy+43*s);ctx.lineTo(cx+21*s,cy+2*s);
  ctx.quadraticCurveTo(cx,cy-5*s,cx-21*s,cy+2*s);
  ctx.fill();ctx.stroke();
  // Col fourrure
  ctx.fillStyle='#7a5a2a';
  ctx.beginPath();
  ctx.moveTo(cx-21*s,cy+2*s);ctx.quadraticCurveTo(cx,cy-5*s,cx+21*s,cy+2*s);
  ctx.lineTo(cx+17*s,cy+16*s);ctx.quadraticCurveTo(cx,cy+9*s,cx-17*s,cy+16*s);
  ctx.closePath();ctx.fill();
  // Fourrure texture
  ctx.strokeStyle='rgba(50,30,0,0.3)';ctx.lineWidth=1*s;
  for(let i=-3;i<=3;i++){
    ctx.beginPath();ctx.moveTo(cx+i*5*s,cy+3*s);ctx.lineTo(cx+i*5.5*s,cy+14*s);ctx.stroke();
  }
  // Médaillon chaîne
  ctx.strokeStyle='#8a7030';ctx.lineWidth=1.5*s;
  ctx.beginPath();ctx.arc(cx,cy+5*s,3*s,0,Math.PI*2);ctx.stroke();
  // Cou large musclé
  ctx.fillStyle='#b07040';ctx.strokeStyle='#7a4a20';ctx.lineWidth=1*s;
  ctx.fillRect(cx-8*s,cy-9*s,16*s,13*s);ctx.strokeRect(cx-8*s,cy-9*s,16*s,13*s);
  // Veines cou
  ctx.strokeStyle='rgba(100,60,20,0.3)';ctx.lineWidth=1*s;
  ctx.beginPath();ctx.moveTo(cx-5*s,cy-9*s);ctx.lineTo(cx-6*s,cy+2*s);ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx+5*s,cy-9*s);ctx.lineTo(cx+6*s,cy+2*s);ctx.stroke();
  // VISAGE CARRÉ / MÂCHOIRE FORTE (trait distinctif)
  ctx.fillStyle='#b07040';ctx.strokeStyle='#7a4a20';ctx.lineWidth=1.8*s;
  ctx.beginPath();
  ctx.moveTo(cx-15*s,cy-29*s);ctx.lineTo(cx-16*s,cy-8*s);
  ctx.bezierCurveTo(cx-16*s,cy+2*s,cx-12*s,cy+3.5*s,cx,cy+3.5*s);
  ctx.bezierCurveTo(cx+12*s,cy+3.5*s,cx+16*s,cy+2*s,cx+16*s,cy-8*s);
  ctx.lineTo(cx+15*s,cy-29*s);
  ctx.quadraticCurveTo(cx,cy-38*s,cx-15*s,cy-29*s);
  ctx.fill();ctx.stroke();
  // Joues marquées
  ctx.fillStyle='rgba(160,80,30,0.2)';
  ctx.beginPath();ctx.ellipse(cx-14*s,cy-10*s,5*s,4*s,0.3,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(cx+14*s,cy-10*s,5*s,4*s,-0.3,0,Math.PI*2);ctx.fill();
  // Cheveux courts (presque rasé sur les côtés)
  ctx.fillStyle='#3a2010';
  ctx.beginPath();ctx.ellipse(cx,cy-32*s,15*s,8.5*s,0,Math.PI,0);ctx.fill();
  // Côtés quasi rasés
  ctx.fillStyle='#5a3820';
  ctx.beginPath();ctx.ellipse(cx-14*s,cy-27*s,5*s,8*s,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(cx+14*s,cy-27*s,5*s,8*s,0,0,Math.PI*2);ctx.fill();
  // Texture cheveux
  ctx.strokeStyle='rgba(0,0,0,0.25)';ctx.lineWidth=0.7*s;
  for(let i=-2;i<=2;i++){
    ctx.beginPath();ctx.moveTo(cx+i*4*s,cy-39*s);ctx.lineTo(cx+i*4*s,cy-30*s);ctx.stroke();
  }
  // SOURCILS TRÈS FRONCÉS (trait distinctif — très prononcé)
  ctx.fillStyle='#2a1508';
  // Sourcil gauche (incliné vers l'intérieur / froncé)
  ctx.beginPath();
  ctx.moveTo(cx-15*s,cy-23*s);ctx.lineTo(cx-3*s,cy-20*s);
  ctx.lineTo(cx-2.5*s,cy-23*s);ctx.lineTo(cx-14*s,cy-26.5*s);ctx.closePath();ctx.fill();
  // Sourcil droit
  ctx.beginPath();
  ctx.moveTo(cx+15*s,cy-23*s);ctx.lineTo(cx+3*s,cy-20*s);
  ctx.lineTo(cx+2.5*s,cy-23*s);ctx.lineTo(cx+14*s,cy-26.5*s);ctx.closePath();ctx.fill();
  // Pli froncement entre sourcils
  ctx.strokeStyle='rgba(80,40,10,0.5)';ctx.lineWidth=1.5*s;
  ctx.beginPath();ctx.moveTo(cx-2*s,cy-20*s);ctx.lineTo(cx-1*s,cy-26*s);ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx+2*s,cy-20*s);ctx.lineTo(cx+1*s,cy-26*s);ctx.stroke();
  // Yeux intenses bleu-gris
  ctx.fillStyle='#2a3550';
  ctx.beginPath();ctx.ellipse(cx-7*s,cy-16.5*s,4.2*s,3.5*s,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(cx+7*s,cy-16.5*s,4.2*s,3.5*s,0,0,Math.PI*2);ctx.fill();
  // Iris
  ctx.fillStyle='#3a4a60';
  ctx.beginPath();ctx.arc(cx-7*s,cy-16.5*s,2.5*s,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(cx+7*s,cy-16.5*s,2.5*s,0,Math.PI*2);ctx.fill();
  // Reflets
  ctx.fillStyle='rgba(255,255,255,0.6)';
  ctx.beginPath();ctx.arc(cx-5.5*s,cy-18.2*s,1.5*s,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(cx+8.5*s,cy-18.2*s,1.5*s,0,Math.PI*2);ctx.fill();
  // Nez fort
  ctx.strokeStyle='#8a5030';ctx.lineWidth=1.5*s;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(cx-2*s,cy-8*s);ctx.lineTo(cx-4*s,cy-3*s);ctx.lineTo(cx-1*s,cy-2*s);ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx+2*s,cy-8*s);ctx.lineTo(cx+4*s,cy-3*s);ctx.lineTo(cx+1*s,cy-2*s);ctx.stroke();
  // BARBE COURTE
  ctx.fillStyle='#4a3020';ctx.strokeStyle='#2a1a08';ctx.lineWidth=0.8*s;
  ctx.beginPath();
  ctx.moveTo(cx-15*s,cy-9*s);
  ctx.bezierCurveTo(cx-16*s,cy,cx-10*s,cy+4.5*s,cx,cy+4.5*s);
  ctx.bezierCurveTo(cx+10*s,cy+4.5*s,cx+16*s,cy,cx+15*s,cy-9*s);
  ctx.fill();ctx.stroke();
  ctx.strokeStyle='rgba(0,0,0,0.2)';ctx.lineWidth=0.6*s;
  for(let i=-2;i<=2;i++){
    ctx.beginPath();ctx.moveTo(cx+i*4.5*s,cy-8*s);ctx.lineTo(cx+i*4*s,cy+2*s);ctx.stroke();
  }
  // Bouche serrée (mâchoire serrée)
  ctx.strokeStyle='#7a4a20';ctx.lineWidth=2.2*s;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(cx-5.5*s,cy-3.5*s);ctx.lineTo(cx+5.5*s,cy-3.5*s);ctx.stroke();
  ctx.restore();
}

// CHARACTER: KEV — barbe rousse massive, chignon, tatouages, costaud
// Traits clés: BARBE ROUSSE ÉNORME, chignon, tatouages bras, grande carrure
// ════════════════════════════════════════
function dKev(ctx,cx,cy,sz,ph){
  const s=sz/64;wings(ctx,cx,cy,sz,ph,'#f0dfc0');
  ctx.save();
  // T-shirt gris (large)
  ctx.fillStyle='#878787';ctx.strokeStyle='#545454';ctx.lineWidth=1.5*s;
  ctx.beginPath();
  ctx.moveTo(cx-21*s,cy+3*s);
  ctx.bezierCurveTo(cx-24*s,cy+26*s,cx-18*s,cy+43*s,cx-9*s,cy+48*s);
  ctx.lineTo(cx+9*s,cy+48*s);
  ctx.bezierCurveTo(cx+18*s,cy+43*s,cx+24*s,cy+26*s,cx+21*s,cy+3*s);
  ctx.fill();ctx.stroke();
  // TATOUAGES sur les bras (trait distinctif)
  // Bras gauche — roses / motifs
  ctx.fillStyle='rgba(45,25,90,0.52)';
  ctx.beginPath();ctx.ellipse(cx-23*s,cy+12*s,5*s,8*s,0.4,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(cx-23*s,cy+23*s,4*s,6*s,-0.1,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(60,20,80,0.35)';
  ctx.beginPath();ctx.ellipse(cx-22*s,cy+32*s,3*s,4*s,0.2,0,Math.PI*2);ctx.fill();
  // Bras droit
  ctx.fillStyle='rgba(45,25,90,0.52)';
  ctx.beginPath();ctx.ellipse(cx+23*s,cy+10*s,5*s,8*s,-0.4,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(cx+23*s,cy+22*s,4*s,6*s,0.1,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(60,20,80,0.35)';
  ctx.beginPath();ctx.ellipse(cx+22*s,cy+31*s,3*s,4*s,-0.2,0,Math.PI*2);ctx.fill();
  // Tatouage cou
  ctx.fillStyle='rgba(50,25,85,0.4)';
  ctx.beginPath();ctx.ellipse(cx+8*s,cy-1*s,4*s,5*s,0.3,0,Math.PI*2);ctx.fill();
  // Cou large
  ctx.fillStyle='#d49060';ctx.strokeStyle='#9a6030';ctx.lineWidth=1.5*s;
  ctx.fillRect(cx-8*s,cy-5*s,16*s,12*s);
  // Visage LARGE et ROND (trait distinctif)
  ctx.beginPath();ctx.ellipse(cx,cy-10*s,19*s,20*s,0,0,Math.PI*2);ctx.fill();ctx.stroke();
  // CHIGNON sur le dessus (trait distinctif)
  ctx.fillStyle='#5a3010';ctx.strokeStyle='#3a2008';ctx.lineWidth=1.5*s;
  // Cheveux sur les côtés
  ctx.beginPath();ctx.ellipse(cx,cy-29*s,19*s,8.5*s,0,Math.PI,0);ctx.fill();
  // Boule du bun
  ctx.fillStyle='#4a2808';
  ctx.beginPath();ctx.arc(cx,cy-36*s,7.5*s,0,Math.PI*2);ctx.fill();ctx.stroke();
  // Élastique du bun
  ctx.strokeStyle='#111';ctx.lineWidth=2.5*s;
  ctx.beginPath();ctx.arc(cx,cy-30*s,5*s,0,Math.PI*2);ctx.stroke();
  // Mèches qui s'échappent
  ctx.strokeStyle='#5a3010';ctx.lineWidth=1.5*s;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(cx-18*s,cy-28*s);ctx.quadraticCurveTo(cx-22*s,cy-24*s,cx-19*s,cy-18*s);ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx+18*s,cy-28*s);ctx.quadraticCurveTo(cx+22*s,cy-24*s,cx+19*s,cy-18*s);ctx.stroke();
  // Sourcils épais
  ctx.fillStyle='#3a2010';
  ctx.beginPath();
  ctx.moveTo(cx-14*s,cy-21*s);ctx.lineTo(cx-3*s,cy-20*s);
  ctx.lineTo(cx-2.5*s,cy-22.5*s);ctx.lineTo(cx-13.5*s,cy-23.5*s);ctx.closePath();ctx.fill();
  ctx.beginPath();
  ctx.moveTo(cx+14*s,cy-21*s);ctx.lineTo(cx+3*s,cy-20*s);
  ctx.lineTo(cx+2.5*s,cy-22.5*s);ctx.lineTo(cx+13.5*s,cy-23.5*s);ctx.closePath();ctx.fill();
  // Yeux
  ctx.fillStyle='#2a1a0a';
  ctx.beginPath();ctx.ellipse(cx-8*s,cy-14.5*s,4.2*s,3.8*s,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(cx+8*s,cy-14.5*s,4.2*s,3.8*s,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.52)';
  ctx.beginPath();ctx.arc(cx-6.5*s,cy-16.5*s,1.8*s,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(cx+9.5*s,cy-16.5*s,1.8*s,0,Math.PI*2);ctx.fill();
  // Nez large
  ctx.fillStyle='#c08050';
  ctx.beginPath();ctx.arc(cx,cy-5*s,3.5*s,0,Math.PI*2);ctx.fill();
  // GROSSE BARBE ROUSSE (TRAIT DISTINCTIF PRINCIPAL)
  ctx.fillStyle='#c84808';ctx.strokeStyle='#882808';ctx.lineWidth=1.8*s;
  ctx.beginPath();
  ctx.moveTo(cx-18*s,cy-9*s);
  ctx.bezierCurveTo(cx-23*s,cy+4*s,cx-18*s,cy+23*s,cx-5*s,cy+28*s);
  ctx.bezierCurveTo(cx-1*s,cy+31*s,cx+1*s,cy+31*s,cx+5*s,cy+28*s);
  ctx.bezierCurveTo(cx+18*s,cy+23*s,cx+23*s,cy+4*s,cx+18*s,cy-9*s);
  ctx.fill();ctx.stroke();
  // Texture/poils de barbe
  ctx.strokeStyle='#7a2806';ctx.lineWidth=1*s;ctx.lineCap='round';
  for(let i=-3;i<=3;i++){
    ctx.beginPath();
    ctx.moveTo(cx+i*5*s,cy-7*s);
    ctx.quadraticCurveTo(cx+i*4.5*s+1*s,cy+10*s,cx+i*4*s,cy+24*s);
    ctx.stroke();
  }
  // Moustache (visible au-dessus barbe)
  ctx.strokeStyle='#a83a08';ctx.lineWidth=3*s;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(cx-9*s,cy-4*s);ctx.quadraticCurveTo(cx,cy+1*s,cx+9*s,cy-4*s);ctx.stroke();
  ctx.restore();
}

// ════════════════════════════════════════
// OBSTACLES — Équipement audiovisuel
// ════════════════════════════════════════
function clipTo(ctx,x,h,ft){
  ctx.beginPath();
  if(ft)ctx.rect(x-3,0,OW+6,h+2);
  else ctx.rect(x-3,H-h-2,OW+6,h+4);
  ctx.clip();
}

// Micro sur pied / micro suspendu
function oMic(ctx,x,h,ft,_t){
  const bx=x+OW/2;ctx.save();clipTo(ctx,x,h,ft);
  if(ft){
    // Micro suspendu du haut (câble depuis le truss)
    ctx.strokeStyle='#2a2a2a';ctx.lineWidth=2;ctx.lineCap='butt';
    ctx.beginPath();ctx.moveTo(bx,0);ctx.lineTo(bx,h-22);ctx.stroke();
    // Support
    ctx.strokeStyle='#444';ctx.lineWidth=5;
    ctx.beginPath();ctx.moveTo(bx-8*1,h-22);ctx.lineTo(bx+8*1,h-22);ctx.stroke();
    // Tête micro capsule
    ctx.fillStyle='#3c3c3c';ctx.strokeStyle='#111';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.ellipse(bx,h-11,11,15,0,0,Math.PI*2);ctx.fill();ctx.stroke();
    // Grille micro
    ctx.strokeStyle='#666';ctx.lineWidth=1;
    for(let i=-9;i<=9;i+=3.5){
      ctx.beginPath();ctx.moveTo(bx+i,h-24);ctx.lineTo(bx+i,h-1);ctx.stroke();
    }
    for(let j=h-24;j<=h-1;j+=4){
      const hw=Math.sqrt(Math.max(0,11*11-(j-(h-11))*(j-(h-11))));
      ctx.beginPath();ctx.moveTo(bx-hw,j);ctx.lineTo(bx+hw,j);ctx.stroke();
    }
    // Bande de montage haut
    ctx.fillStyle='#333';ctx.fillRect(x,0,OW,9);
  } else {
    // Micro sur pied trépied depuis le bas
    const bot=H;
    ctx.strokeStyle='#2e2e2e';ctx.lineWidth=2.5;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(bx,bot-h+15);ctx.lineTo(bx-20,bot-2);ctx.stroke();
    ctx.beginPath();ctx.moveTo(bx,bot-h+15);ctx.lineTo(bx+20,bot-2);ctx.stroke();
    ctx.beginPath();ctx.moveTo(bx,bot-h+15);ctx.lineTo(bx,bot-2);ctx.stroke();
    // Tige verticale
    ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(bx,bot-h);ctx.lineTo(bx,bot-h+17);ctx.stroke();
    // Col de cygne
    ctx.strokeStyle='#555';ctx.lineWidth=4;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(bx,bot-h);ctx.bezierCurveTo(bx,bot-h-14,bx+14,bot-h-18,bx+14,bot-h-33);ctx.stroke();
    // Tête micro
    ctx.fillStyle='#3c3c3c';ctx.strokeStyle='#111';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.ellipse(bx+14,bot-h-46,9.5,14,0.3,0,Math.PI*2);ctx.fill();ctx.stroke();
    ctx.strokeStyle='#666';ctx.lineWidth=0.8;
    for(let i=-8;i<=8;i+=3){
      ctx.beginPath();ctx.moveTo(bx+14+i,bot-h-58);ctx.lineTo(bx+14+i,bot-h-37);ctx.stroke();
    }
    // Base
    ctx.fillStyle='#333';ctx.fillRect(x,bot-8,OW,8);
  }
  ctx.restore();
}

// Enceinte colonne
function oSpk(ctx,x,h,ft,_t){
  const bx=x+OW/2;ctx.save();clipTo(ctx,x,h,ft);
  const yRef=ft?0:H-h;
  // Caisson
  ctx.fillStyle='#161616';ctx.strokeStyle='#000';ctx.lineWidth=1.8;
  ctx.fillRect(x+4,yRef,OW-8,h);ctx.strokeRect(x+4,yRef,OW-8,h);
  // Surface tissu grill
  ctx.fillStyle='#1e1e1e';ctx.fillRect(x+6,yRef+5,OW-12,h-10);
  // Haut-parleurs
  const step=Math.min(32,h/3.5);
  for(let sy=yRef+step/2;sy<yRef+h-step/3;sy+=step){
    const r=Math.min(12,(OW-14)/2);
    // Entourage HP
    ctx.beginPath();ctx.arc(bx,sy,r,0,Math.PI*2);
    ctx.fillStyle='#2c2c2c';ctx.fill();
    ctx.strokeStyle='#0a0a0a';ctx.lineWidth=1.5;ctx.stroke();
    // Membrane
    ctx.beginPath();ctx.arc(bx,sy,r*.6,0,Math.PI*2);
    ctx.fillStyle='#424242';ctx.fill();
    // Dome central
    ctx.beginPath();ctx.arc(bx,sy,r*.25,0,Math.PI*2);
    ctx.fillStyle='#1a1a1a';ctx.fill();
    // Suspension
    ctx.strokeStyle='rgba(80,80,80,0.4)';ctx.lineWidth=1;
    for(let a=0;a<Math.PI*2;a+=Math.PI/4){
      ctx.beginPath();ctx.moveTo(bx+Math.cos(a)*r*.6,sy+Math.sin(a)*r*.6);
      ctx.lineTo(bx+Math.cos(a)*r*.85,sy+Math.sin(a)*r*.85);ctx.stroke();
    }
  }
  // Accroches/pieds
  ctx.fillStyle='#3a3a3a';
  if(ft){ctx.fillRect(x+4,0,OW-8,6);ctx.fillRect(x+12,0,OW-24,3);}
  else{ctx.fillRect(x+4,H-8,OW-8,8);}
  ctx.restore();
}

// Barre LED / truss avec PAR cans
function oLed(ctx,x,h,ft,t){
  const bx=x+OW/2,nl=5;ctx.save();clipTo(ctx,x,h,ft);
  if(ft){
    // Structure truss verticale
    ctx.strokeStyle='#6a6a6a';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(x+7,0);ctx.lineTo(x+7,h-20);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x+OW-7,0);ctx.lineTo(x+OW-7,h-20);ctx.stroke();
    ctx.strokeStyle='#888';ctx.lineWidth=1.2;
    for(let y=8;y<h-20;y+=13){
      ctx.beginPath();ctx.moveTo(x+7,y);ctx.lineTo(x+OW-7,y);ctx.stroke();
      ctx.beginPath();ctx.moveTo(x+7,y);ctx.lineTo(x+OW-7,y+13);ctx.stroke();
    }
    // Barre LED
    ctx.fillStyle='#181818';ctx.strokeStyle='#000';ctx.lineWidth=1;
    ctx.fillRect(x,h-20,OW,20);ctx.strokeRect(x,h-20,OW,20);
    // LEDs colorées animées
    for(let i=0;i<nl;i++){
      const lx=x+6+i*(OW-12)/(nl-1);
      const hue=(t*3+i*65)%360;
      ctx.fillStyle=`hsl(${hue},100%,52%)`;
      ctx.beginPath();ctx.arc(lx,h-10,5.5,0,Math.PI*2);ctx.fill();
      // Glow LED
      const g=ctx.createRadialGradient(lx,h-10,0,lx,h-10,18);
      g.addColorStop(0,`hsla(${hue},100%,65%,0.55)`);g.addColorStop(1,`hsla(${hue},100%,50%,0)`);
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(lx,h-10,18,0,Math.PI*2);ctx.fill();
    }
    ctx.fillStyle='#3a3a3a';ctx.fillRect(x,0,OW,8);
  } else {
    // Sur pied depuis le bas
    ctx.strokeStyle='#6a6a6a';ctx.lineWidth=4;
    ctx.beginPath();ctx.moveTo(bx,H);ctx.lineTo(bx,H-h+18);ctx.stroke();
    // Trépied
    ctx.lineWidth=2.5;
    ctx.beginPath();ctx.moveTo(bx,H-7);ctx.lineTo(bx-21,H);ctx.stroke();
    ctx.beginPath();ctx.moveTo(bx,H-7);ctx.lineTo(bx+21,H);ctx.stroke();
    // Barre LED
    ctx.fillStyle='#181818';ctx.strokeStyle='#000';ctx.lineWidth=1;
    ctx.fillRect(x,H-h,OW,22);ctx.strokeRect(x,H-h,OW,22);
    for(let i=0;i<nl;i++){
      const lx=x+6+i*(OW-12)/(nl-1);
      const hue=(t*4+i*55+130)%360;
      ctx.fillStyle=`hsl(${hue},100%,52%)`;
      ctx.beginPath();ctx.arc(lx,H-h+11,5.5,0,Math.PI*2);ctx.fill();
      const g=ctx.createRadialGradient(lx,H-h+11,0,lx,H-h+11,18);
      g.addColorStop(0,`hsla(${hue},100%,65%,0.5)`);g.addColorStop(1,`hsla(${hue},100%,50%,0)`);
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(lx,H-h+11,18,0,Math.PI*2);ctx.fill();
    }
    ctx.fillStyle='#3a3a3a';ctx.fillRect(x,H-8,OW,8);
  }
  ctx.restore();
}

// Table de mixage / régie
function oMix(ctx,x,h,ft,_t){
  const bx=x+OW/2;ctx.save();clipTo(ctx,x,h,ft);
  if(ft){
    // Câbles qui pendent
    ctx.strokeStyle='#1e1e1e';ctx.lineWidth=2;ctx.lineCap='round';
    for(let i=0;i<4;i++){
      const cx2=x+8+i*13;
      ctx.beginPath();ctx.moveTo(cx2,0);
      ctx.bezierCurveTo(cx2+4,h*.3,cx2-5,h*.65,cx2,h-5);ctx.stroke();
    }
    // Console (depuis le haut)
    ctx.fillStyle='#1a1a1a';ctx.strokeStyle='#000';ctx.lineWidth=1.5;
    ctx.fillRect(x,h-38,OW,38);ctx.strokeRect(x,h-38,OW,38);
    // Surface avec faders
    ctx.fillStyle='#111';ctx.fillRect(x+2,h-36,OW-4,3);
    for(let i=0;i<4;i++){
      const fx=x+5+i*12;
      // Rail fader
      ctx.fillStyle='#3a3a3a';ctx.fillRect(fx,h-32,4,24);
      // Curseur fader
      const fpos=h-28+i%3*5;
      ctx.fillStyle='#c8c8c8';ctx.strokeStyle='#888';ctx.lineWidth=0.5;
      ctx.fillRect(fx-2,fpos,8,6);ctx.strokeRect(fx-2,fpos,8,6);
    }
    // VU-mètre
    ctx.fillStyle='#0f0';ctx.fillRect(bx+12,h-32,5,14);
    ctx.fillStyle='#ff0';ctx.fillRect(bx+12,h-38,5,5);
    // Boutons
    const bcolors=['#f44','#0f0','#ff0'];
    for(let i=0;i<3;i++){ctx.fillStyle=bcolors[i];ctx.beginPath();ctx.arc(x+8+i*8,h-38+3,2.5,0,Math.PI*2);ctx.fill();}
  } else {
    // Console depuis le bas
    ctx.fillStyle='#1a1a1a';ctx.strokeStyle='#000';ctx.lineWidth=1.5;
    ctx.fillRect(x,H-h,OW,h);ctx.strokeRect(x,H-h,OW,h);
    // Surface top
    ctx.fillStyle='#0e0e0e';ctx.fillRect(x,H-h,OW,5);
    // Faders
    const fstep=Math.min(22,h/5);
    for(let i=0;i<4;i++){
      const fy=H-h+8+i*fstep;
      if(fy>=H-10)continue;
      ctx.fillStyle='#333';ctx.fillRect(x+4,fy,OW-8,3);
      ctx.fillStyle='#aaa';ctx.strokeStyle='#777';ctx.lineWidth=0.5;
      ctx.fillRect(x+13+i*5,fy-4,9,10);ctx.strokeRect(x+13+i*5,fy-4,9,10);
    }
    // Boutons ronds
    const by=H-h+Math.min(80,h-15);
    for(let i=0;i<5;i++){
      ctx.fillStyle=i%2?'#0f0':'#c44';
      ctx.beginPath();ctx.arc(x+7+i*9,by,3,0,Math.PI*2);ctx.fill();
    }
    ctx.fillStyle='#3a3a3a';ctx.fillRect(x,H-8,OW,8);
  }
  ctx.restore();
}

// Projecteur PAR can
function oPar(ctx,x,h,ft,t){
  const bx=x+OW/2,hue=(t*1.8)%360;ctx.save();clipTo(ctx,x,h,ft);
  if(ft){
    // Tige d'accrochage
    ctx.strokeStyle='#555';ctx.lineWidth=4.5;
    ctx.beginPath();ctx.moveTo(bx,0);ctx.lineTo(bx,h-28);ctx.stroke();
    // Anneau de sécurité
    ctx.strokeStyle='#f59e0b';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(bx,h-35,4,0,Math.PI*2);ctx.stroke();
    // Corps du PAR can
    ctx.fillStyle='#1c1c1c';ctx.strokeStyle='#0a0a0a';ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(bx-17,h-28);ctx.lineTo(bx+17,h-28);
    ctx.lineTo(bx+11,h-4);ctx.lineTo(bx-11,h-4);ctx.closePath();
    ctx.fill();ctx.stroke();
    // Détails corps
    ctx.strokeStyle='#333';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(bx-15,h-23);ctx.lineTo(bx+15,h-23);ctx.stroke();
    ctx.beginPath();ctx.moveTo(bx-13,h-18);ctx.lineTo(bx+13,h-18);ctx.stroke();
    // Lentille colorée
    ctx.beginPath();ctx.arc(bx,h-4,10,0,Math.PI*2);
    ctx.fillStyle=`hsl(${hue},100%,48%)`;ctx.fill();
    ctx.beginPath();ctx.arc(bx,h-4,7,0,Math.PI*2);
    ctx.fillStyle=`hsl(${hue},100%,62%)`;ctx.fill();
    ctx.beginPath();ctx.arc(bx,h-4,3,0,Math.PI*2);
    ctx.fillStyle='#fff';ctx.fill();
    // Glow cone vers le bas
    const g=ctx.createRadialGradient(bx,h,0,bx,h+20,55);
    g.addColorStop(0,`hsla(${hue},100%,65%,0.6)`);g.addColorStop(1,`hsla(${hue},100%,50%,0)`);
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(bx,h+10,55,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#3a3a3a';ctx.fillRect(x,0,OW,8);
  } else {
    // Sur pied depuis le bas
    ctx.strokeStyle='#555';ctx.lineWidth=4.5;
    ctx.beginPath();ctx.moveTo(bx,H);ctx.lineTo(bx,H-h+30);ctx.stroke();
    // Trépied
    ctx.lineWidth=2.5;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(bx,H-9);ctx.lineTo(bx-23,H);ctx.stroke();
    ctx.beginPath();ctx.moveTo(bx,H-9);ctx.lineTo(bx+23,H);ctx.stroke();
    // Corps PAR incliné
    ctx.save();ctx.translate(bx,H-h+16);ctx.rotate(0.32);
    ctx.fillStyle='#1c1c1c';ctx.strokeStyle='#0a0a0a';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(-16,-23);ctx.lineTo(16,-23);ctx.lineTo(10,0);ctx.lineTo(-10,0);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.strokeStyle='#333';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(-13,-18);ctx.lineTo(13,-18);ctx.stroke();
    ctx.beginPath();ctx.arc(0,0,9,0,Math.PI*2);
    ctx.fillStyle=`hsl(${hue},100%,48%)`;ctx.fill();
    ctx.beginPath();ctx.arc(0,0,5.5,0,Math.PI*2);
    ctx.fillStyle=`hsl(${hue},100%,62%)`;ctx.fill();
    ctx.restore();
    // Glow
    const g=ctx.createRadialGradient(bx+12,H-h+16,0,bx+12,H-h+16,44);
    g.addColorStop(0,`hsla(${hue},100%,65%,0.52)`);g.addColorStop(1,`hsla(${hue},100%,50%,0)`);
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(bx+12,H-h+16,44,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#3a3a3a';ctx.fillRect(x,H-8,OW,8);
  }
  ctx.restore();
}

const OTYPES=['mic','spk','led','mix','par'];
const ODRW={mic:oMic,spk:oSpk,led:oLed,mix:oMix,par:oPar};

function drawObs(o,t){
  const th=o.gapY-o.gapHeight/2,bh=H-(o.gapY+o.gapHeight/2);
  const fn=ODRW[o.type];
  if(th>2)fn(ctx,o.x,th,true,t);
  if(bh>2)fn(ctx,o.x,bh,false,t);
}

// ════════════════════════════════════════
// BACKGROUND — Scène/venue sombre
// ════════════════════════════════════════
function drawBg(sx,t){
  // Fond
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#07071a');bg.addColorStop(0.6,'#0c0c22');bg.addColorStop(1,'#0a0a18');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  // Ambiance spots mobiles
  for(let i=0;i<3;i++){
    const a=t*.007+i*2.094,lx=W*.5+Math.cos(a)*W*.26;
    const hue=(i*120+t*.35)%360;
    const g=ctx.createRadialGradient(lx,CEIL*0.6,0,lx,H*.55,H*.56);
    g.addColorStop(0,`hsla(${hue},75%,48%,0.072)`);g.addColorStop(1,`hsla(${hue},65%,30%,0)`);
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  }
  // Truss horizontal en haut
  const ty=CEIL-20;
  ctx.fillStyle='#383838';ctx.fillRect(0,ty,W,13);
  // Entretoises truss
  ctx.strokeStyle='#545454';ctx.lineWidth=1.5;
  for(let px=(-sx%36);px<W;px+=36){
    ctx.beginPath();ctx.moveTo(px,ty);ctx.lineTo(px+18,ty+13);ctx.stroke();
    ctx.beginPath();ctx.moveTo(px+18,ty);ctx.lineTo(px,ty+13);ctx.stroke();
  }
  // Barres verticales truss
  ctx.strokeStyle='#4a4a4a';ctx.lineWidth=3;
  for(let px=(-sx%36);px<W;px+=36){
    ctx.beginPath();ctx.moveTo(px+8,ty);ctx.lineTo(px+8,ty+13);ctx.stroke();
  }
  // Câbles pendants
  ctx.strokeStyle='rgba(65,65,65,0.45)';ctx.lineWidth=1.5;
  for(let px=(-sx%110+55);px<W;px+=110){
    const sag=Math.sin(px*0.09+t*0.02)*5;
    ctx.beginPath();ctx.moveTo(px,ty+13);ctx.quadraticCurveTo(px+sag,ty+40,px,ty+55+sag);ctx.stroke();
  }
  // Sol de scène
  const fy=H*FLOORR;
  ctx.fillStyle='#110f08';ctx.fillRect(0,fy,W,H-fy);
  // Marques au sol
  ctx.strokeStyle='rgba(70,55,20,0.22)';ctx.lineWidth=1;
  for(let px=(-sx%62);px<W;px+=62){ctx.beginPath();ctx.moveTo(px,fy);ctx.lineTo(px,H);ctx.stroke();}
  // Bande de sol lumineuse
  ctx.strokeStyle='rgba(110,85,30,0.4)';ctx.lineWidth=2.5;
  ctx.beginPath();ctx.moveTo(0,fy);ctx.lineTo(W,fy);ctx.stroke();
  // Reflet sol subtil
  const fr=ctx.createLinearGradient(0,fy,0,fy+40);
  fr.addColorStop(0,'rgba(180,140,40,0.06)');fr.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=fr;ctx.fillRect(0,fy,W,40);
}

// ════════════════════════════════════════
// GAME STATE
// ════════════════════════════════════════
let ST='select',sel=0;
let pl,obs,sc,spd,sx,wp,tk,pr,hi=0;

function init(){
  pl={x:W*.27,y:H/2,vy:0};
  obs=[];sc=0;spd=BSPD;sx=0;wp=0;tk=0;pr=false;
  spawnO(W+80);
}

function spawnO(startX){
  const minY=Math.max(H*.27,155),maxY=Math.min(H*.73,H-155);
  const gh=Math.max(GAPMIN,GAPST-sc*.045);
  obs.push({
    x:startX??W+20,
    gapY:minY+Math.random()*(maxY-minY),
    gapHeight:gh,
    type:OTYPES[Math.floor(Math.random()*5)],
    scored:false
  });
}

// ── Collision cercle
function hit(){
  const r=CSZ*.27,px=pl.x,py=pl.y;
  for(const o of obs){
    if(px+r>o.x+3&&px-r<o.x+OW-3){
      if(py-r<o.gapY-o.gapHeight/2||py+r>o.gapY+o.gapHeight/2)return true;
    }
  }
  return py-r<CEIL||py+r>H*FLOORR;
}

// ── Physics update
function update(){
  if(ST!=='playing')return;
  tk++;sc++;spd=BSPD+tk*SPDI;sx+=spd;
  // Physics avec inertie
  if(pr)pl.vy+=((-8.8)-pl.vy)*.21;
  else pl.vy+=GRAV;
  pl.vy=Math.max(-11.5,Math.min(pl.vy,13.5));
  pl.y+=pl.vy;
  wp+=.19;
  // Obstacles
  for(const o of obs){o.x-=spd;if(!o.scored&&o.x+OW<pl.x)o.scored=true;}
  const lo=obs[obs.length-1];
  if(!lo||lo.x<W-OBSP)spawnO();
  obs=obs.filter(o=>o.x+OW>-15);
  if(hit()){ST='gameover';if(sc>hi)hi=sc;}
}

// ════════════════════════════════════════
// RENDER
// ════════════════════════════════════════
function render(){
  ctx.clearRect(0,0,W,H);

  if(ST==='playing'||ST==='gameover'){
    drawBg(sx,tk);
    for(const o of obs)drawObs(o,tk);
    CHARS[sel].draw(ctx,pl.x,pl.y,CSZ,wp);

    // HUD Score
    ctx.save();
    ctx.fillStyle='rgba(0,0,0,0.5)';
    ctx.beginPath();ctx.roundRect(W/2-58,14,116,36,10);ctx.fill();
    ctx.strokeStyle='rgba(168,85,247,0.4)';ctx.lineWidth=1;
    ctx.beginPath();ctx.roundRect(W/2-58,14,116,36,10);ctx.stroke();
    ctx.fillStyle='#fff';ctx.font=`bold 21px 'Barlow Condensed','Arial Black',Arial`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(Math.floor(sc/10),W/2,30);
    ctx.fillStyle='rgba(168,85,247,0.7)';ctx.font=`700 9px 'Barlow Condensed',Arial`;ctx.textBaseline='alphabetic';
    ctx.fillText('SCORE',W/2,46);
    ctx.restore();

    // Hint début
    if(tk<90&&ST==='playing'){
      const a=Math.max(0,1-tk/65);
      ctx.save();ctx.globalAlpha=a;
      ctx.fillStyle='rgba(0,0,0,0.55)';
      ctx.beginPath();ctx.roundRect(W/2-92,H/2+62,184,32,9);ctx.fill();
      ctx.fillStyle='#fff';ctx.font=`700 12px 'Barlow Condensed',Arial`;ctx.textAlign='center';
      ctx.fillText('Maintiens le doigt pour monter',W/2,H/2+82);
      ctx.restore();
    }
  }

  // ── GAME OVER overlay
  if(ST==='gameover'){
    ctx.save();
    ctx.fillStyle='rgba(0,0,0,0.65)';ctx.fillRect(0,0,W,H);
    const pw=Math.min(316,W-32),px2=(W-pw)/2,py2=H/2-118;
    // Panel
    ctx.fillStyle='#0c1020';ctx.strokeStyle='rgba(168,85,247,0.6)';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.roundRect(px2,py2,pw,240,14);ctx.fill();ctx.stroke();
    // Glow intérieur
    const ig=ctx.createRadialGradient(W/2,py2,0,W/2,py2+60,200);
    ig.addColorStop(0,'rgba(168,85,247,0.06)');ig.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=ig;ctx.beginPath();ctx.roundRect(px2,py2,pw,240,14);ctx.fill();
    // Titre
    ctx.fillStyle='#fff';ctx.font=`900 31px 'Barlow Condensed','Arial Black',Arial`;ctx.textAlign='center';
    ctx.fillText('GAME OVER',W/2,py2+46);
    // Score label
    ctx.fillStyle='rgba(168,85,247,0.7)';ctx.font=`700 12px 'Barlow Condensed',Arial`;
    ctx.fillText('SCORE',W/2,py2+80);
    // Score number
    ctx.fillStyle='#fff';ctx.font=`900 50px 'Barlow Condensed','Arial Black',Arial`;
    ctx.fillText(Math.floor(sc/10),W/2,py2+132);
    // Record
    if(hi>0){
      const isRecord=sc>=hi&&sc>0;
      ctx.fillStyle=isRecord?'#f59e0b':'rgba(255,255,255,0.35)';
      ctx.font=`700 12px 'Barlow Condensed',Arial`;
      ctx.fillText(isRecord?`🏆 NOUVEAU RECORD !`:`RECORD : ${Math.floor(hi/10)}`,W/2,py2+155);
    }
    // Boutons
    const bw=Math.min(130,(pw-36)/2);
    const by=py2+172;
    // Rejouer
    ctx.fillStyle='#7c3aed';ctx.beginPath();ctx.roundRect(W/2-bw-5,by,bw,42,10);ctx.fill();
    ctx.strokeStyle='rgba(168,85,247,0.6)';ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(W/2-bw-5,by,bw,42,10);ctx.stroke();
    ctx.fillStyle='#fff';ctx.font=`900 15px 'Barlow Condensed','Arial Black',Arial`;
    ctx.fillText('↺  REJOUER',W/2-bw/2-5,by+26);
    // Menu
    ctx.fillStyle='#2a2a3a';ctx.beginPath();ctx.roundRect(W/2+5,by,bw,42,10);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.1)';ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(W/2+5,by,bw,42,10);ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,0.7)';ctx.font=`900 15px 'Barlow Condensed','Arial Black',Arial`;
    ctx.fillText('≡  MENU',W/2+bw/2+5,by+26);
    ctx.restore();
  }
}

// ════════════════════════════════════════
// INPUT
// ════════════════════════════════════════
function goClick(ex,ey){
  const pw=Math.min(316,W-32),px2=(W-pw)/2,py2=H/2-118;
  const bw=Math.min(130,(pw-36)/2),by=py2+172;
  if(ex>=W/2-bw-5&&ex<=W/2-5&&ey>=by&&ey<=by+42){init();ST='playing';return;}
  if(ex>=W/2+5&&ex<=W/2+bw+5&&ey>=by&&ey<=by+42){
    ST='select';document.getElementById('ss').style.display='flex';
  }
}

gc.addEventListener('touchstart',e=>{
  e.preventDefault();
  if(ST==='playing')pr=true;
  else if(ST==='gameover')goClick(e.touches[0].clientX,e.touches[0].clientY);
},{passive:false});
gc.addEventListener('touchend',e=>{e.preventDefault();pr=false;},{passive:false});
gc.addEventListener('touchcancel',e=>{e.preventDefault();pr=false;},{passive:false});
gc.addEventListener('mousedown',e=>{
  if(ST==='playing')pr=true;
  else if(ST==='gameover')goClick(e.clientX,e.clientY);
});
gc.addEventListener('mouseup',()=>pr=false);
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('keydown',e=>{if(e.code==='Space'&&ST==='playing'){pr=true;e.preventDefault();}});
document.addEventListener('keyup',e=>{if(e.code==='Space')pr=false;});

// ════════════════════════════════════════
// SELECT SCREEN
// ════════════════════════════════════════
function buildSel(){
  const grid=document.getElementById('cg');
  grid.innerHTML='';
  const ps=Math.min(128,Math.floor((innerWidth-80)/2));
  CHARS.forEach((ch,i)=>{
    const card=document.createElement('div');
    card.className='cc'+(i===sel?' sel':'');
    const cv=document.createElement('canvas');
    cv.width=ps;cv.height=Math.round(ps*1.12);
    const c=cv.getContext('2d');
    // BG preview
    const bg=c.createLinearGradient(0,0,0,cv.height);
    bg.addColorStop(0,'rgba(20,10,40,0.8)');bg.addColorStop(1,'rgba(5,5,20,0.9)');
    c.fillStyle=bg;c.fillRect(0,0,cv.width,cv.height);
    // Draw character
    ch.draw(c,cv.width/2,cv.height/2,ps*.74,0.6);
    const nm=document.createElement('div');nm.className='cn';nm.textContent=ch.name;
    card.appendChild(cv);card.appendChild(nm);
    card.addEventListener('click',()=>{
      sel=i;
      document.querySelectorAll('.cc').forEach((c2,j)=>c2.className='cc'+(j===i?' sel':''));
    });
    grid.appendChild(card);
  });
}

document.getElementById('pb').addEventListener('click',()=>{
  document.getElementById('ss').style.display='none';
  init();ST='playing';
});

// ════════════════════════════════════════
// MAIN LOOP
// ════════════════════════════════════════
function loop(){update();render();requestAnimationFrame(loop);}
buildSel();
loop();
</script>
